<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Light Client</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h3>Client 2 - 192.168.60.11</h3>
    <h1>Christmas Lights Control</h1>

    <p>Client Program ID</p>
    <input type="text" placeholder="Client Program ID" id="client_id">
    <p>Number of Lights:</p>
    <input type="number" min="1" max="1000" id="num" value="1">
    <button id="restart-client">Restart Client</button>

    <script>
        $(document).ready(function() {
            // Turn on lights button click (with parameters)
            $('#restart-client').click(function() {
                const id = document.getElementById("client_id").value
                const num = document.getElementById("num").value
                $.get(`/restart-client?id=${id}&num=${num}`, function(data) {
                    $('#status').text(data.message);
                });
            });
        });
    </script>
</body>
</html>
